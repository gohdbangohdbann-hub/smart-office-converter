appId: com.nawa.numbertowords
productName: NumberToWords
copyright: Copyright © 2026 Nawa OCR Office
files:
  - desktop/**/*
  - dist/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: NumberToWords-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
